hostname = SpeedwayR-16-D3-7C
; bpi_tag_epc = E28011704000021D48A0F8FE
; target_epc = E28011704000021D48A0F8FE
target_epc = E2801190A5020060167735BE
; target_epc = E2801190A502006016773750

reference_distance = "测量参考值时的距离"
reference_distance = near_distance
; reference_distance = far_distance
; reference_distance = all_distance
; reference_distance = extend_ends_k_-3

feature_lineSet = "一个水位，是否从不同标签角度测量，对应多条曲线"
; feature_lineSet = false
feature_lineSet = true

record_scan_data = "是否记录实际感知时的数据"
; record_scan_data = false
record_scan_data = true

feature_dir = "液体容器类型，不同类型的数据记录到不同目录"
; feature_dir = tag-features
; feature_dir = Filter_EPC
; feature_dir = Target_EPC
; feature_dir = conical_cup
feature_dir = column_cup
; feature_dir = long_column
; feature_dir = AutoTune_Enable
; feature_dir = AutoTune_Disable

tag_feature = "测量参考值时或实际感知时的水位"
tag_feature = 200ml

settings {
    ReaderMode = MaxThroughput
    SearchMode = DualTarget
    Session = 2
    TagPopulationEstimate = 16

    report {
        IncludeAntennaPortNumber = true
        IncludeFirstSeenTime = true
        IncludeLastSeenTime = true
        IncludeFastId = true
        IncludePeakRssi = true
        IncludePcBits = true
        IncludeChannel = true
        IncludeDopplerFrequency = true
        IncludePhaseAngle = true
        Mode = Individual
    }
    filters {
;         Mode = OnlyFilter1
;         Mode = UseTagSelectFilters
        Mode = None
    }
}
antenna_default {
    Enabled = false
    IsMaxTxPower = false
    TxPowerinDbm = 20 # 31.5
    IsMaxRxSensitivity = true
}
antennas = [
    ${antenna_default} { Enabled = true }
    ${antenna_default}
    ${antenna_default}
    ${antenna_default}
]

select_filter_default {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    TagMask = 000000000000000000000000
    MatchingAction = Select
    NonMatchingAction = Unselect
}
select_filters = [
    ${select_filter_default} {
        BitPointer = 32
        BitCount = 96
        MemoryBank = Epc
;         TagMask = E28011704000021D48A0F8FE
        TagMask = ${target_epc}
    }
]

filter1 {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    FilterOp = Match
;     TagMask = E28011704000021D48A0F8FE
    TagMask = ${target_epc}
}
filter2 {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    FilterOp = Match
;     TagMask = E28011704000021D48A0F8FE
    TagMask = ${target_epc}
}
