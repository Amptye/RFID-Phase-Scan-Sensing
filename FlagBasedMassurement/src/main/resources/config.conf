settings {
    ReaderMode = MaxThroughput
    SearchMode = DualTarget
    Session = 2
    TagPopulationEstimate = 8

    report {
        IncludeAntennaPortNumber = true
        IncludeFirstSeenTime = true
        IncludeLastSeenTime = true
        IncludeFastId = true
        IncludePeakRssi = true
        IncludePcBits = true
        IncludeChannel = true
        IncludeDopplerFrequency = true
        IncludePhaseAngle = true
        Mode = Individual
    }
    filters {
;         Mode = OnlyFilter1
;         Mode = UseTagSelectFilters
        Mode = None
    }
}
antenna_default {
    Enabled = false
    IsMaxTxPower = false
    TxPowerinDbm = 20 # 31.5
    IsMaxRxSensitivity = true
}
antennas = [
    ${antenna_default} { Enabled = true }
    ${antenna_default}
    ${antenna_default}
    ${antenna_default}
]

select_filter_default {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    TagMask = 000000000000000000000000
    MatchingAction = Select
    NonMatchingAction = Unselect
}
select_filters = [
    ${select_filter_default} {
        BitPointer = 32
        BitCount = 96
        MemoryBank = Epc
        TagMask = ${target_epc}
    }
]

filter1 {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    FilterOp = Match
    TagMask = ${target_epc}
}
filter2 {
    BitPointer = 32
    BitCount = 96
    MemoryBank = Epc
    FilterOp = Match
    TagMask = ${target_epc}
}
